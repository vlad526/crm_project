version: '3.8'
services:
  mysql-db:
    image: mysql:8.0
    container_name: crm_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: crm-school
      MYSQL_DATABASE: crm-school_db
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
#    command: sh -c "npm run seed && npm run start:dev"
volumes:
  mysql_data: